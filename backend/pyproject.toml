[project]
name = "engineering-efficiency-backend"
version = "0.1.0"
description = "Backend API for the Engineering Efficiency dashboard (Linear -> SQLite -> FastAPI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI relies on calling `Depends`/`Query` in argument defaults.
ignore = ["B008"]

[tool.uv]
package = false
